name: CI

on:
  push:
    branches: [main]
  pull_request:

# PR 快速迭代时取消排队中的旧运行，节省额度
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # 全门（lint/format/typecheck/test/build）兜底上限：挂起任务不空耗 6h 额度
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit production dependencies
        # 依赖安全门（2026-08-14 审查补）：此前 npm audit 清零只是历史一次性动作，
        # 未来升级引入新高危依赖时 CI 必须拦截（react-router v6 线 2 个 moderate 已知，
        # audit-level=high 不拦截，待升 v7 规划见 notes 坑 85）
        run: npm audit --omit=dev --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Type check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
