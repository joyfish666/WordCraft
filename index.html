<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="言筑 WordCraft —— 通过自然语言对话快速生成 3D 空间结构模型的纯前端 Web 应用"
    />
    <title>言筑 WordCraft</title>
    <script>
      // 单页应用深链接还原（与 404.html 配对）：GitHub Pages 对未命中路径返回 404.html，
      // 它以 /WordCraft/?/settings 形式重定向到这里——把路径从查询串还原给应用路由
      // （history.replaceState 后 BrowserRouter 读到真实路径），深链接刷新不丢页面。
      ;(function () {
        var s = window.location.search
        if (s.indexOf('?/') === 0) {
          var decoded = s.slice(2)
          try {
            decoded = decodeURIComponent(decoded)
          } catch (e) {}
          window.history.replaceState(null, '', '/' + decoded.replace(/^\/+/, '') + window.location.hash)
        }
      })()
    </script>
    <script>
      // 首帧前预置 html lang（与 App.tsx 的 documentElement.lang 同步逻辑一致）：
      // 英文系统用户首帧不再闪出中文 lang/标题环境（坑 126）；React 挂载后由应用接管
      try {
        var lang = (navigator.language || 'zh').toLowerCase()
        if (lang.indexOf('zh') !== 0) document.documentElement.lang = 'en'
      } catch (e) {}
    </script>
    <script>
      // 首帧前预判移动端紧凑布局（对应 OrientationGuard 的 wc-compact，避免横屏手机
      // 首帧闪出桌面布局；CSS 样式由 document.documentElement 上的 wc-compact 类门控）
      try {
        var w = window.innerWidth,
          h = window.innerHeight
        if (w <= 760 || h <= 480) document.documentElement.classList.add('wc-compact')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
